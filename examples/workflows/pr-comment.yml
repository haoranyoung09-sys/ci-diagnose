# Opt-in comment. Default is off. One comment is created and later updated.
# Needs pull-requests: write. Fork pull requests may not have that grant.

name: CI Doctor

"on":
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  triage:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Classify and comment
        uses: haoranyoung09-sys/ci-diagnose@v1
        with:
          run-id: ${{ github.event.workflow_run.id }}
          comment: true
