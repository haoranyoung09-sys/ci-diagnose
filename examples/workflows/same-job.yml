# Same job: save the failing command's output, then classify that file.
# `if: failure()` does not see this job's log archive. The job is still
# running, so the Actions logs API has nothing to download yet.
# `set -o pipefail` makes `tee` keep the test's exit code.

name: CI

"on":
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: set -o pipefail; npm test 2>&1 | tee ci.log

      - name: Classify the saved log
        if: failure()
        uses: haoranyoung09-sys/ci-diagnose@v1
        with:
          log-path: ci.log
